<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Céu nublado" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa3b5"/>
      <stop offset="1" stop-color="#cfdbe5"/>
    </linearGradient>
    <g id="cloud">
      <circle cx="40" cy="50" r="28"/>
      <circle cx="80" cy="35" r="36"/>
      <circle cx="125" cy="50" r="28"/>
      <rect x="40" y="50" width="85" height="28" rx="14"/>
